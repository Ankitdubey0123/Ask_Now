spring.application.name=AskNow

# ===============================
# SERVER (Render & Local support)
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# MULTIPART FILE UPLOADS (Reels Videos & Thumbnails)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# MYSQL DATABASE (Production / Render / Local)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/asknow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ankit@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# INITIALIZER CREDENTIALS
# ===============================
app.admin.email=ankitkumardubey167@gmail.com
app.admin.password=Ankit@1234
app.teacher.email=teacher1@gmail.com
app.teacher.password=teacher1

# ===============================
# GEMINI AI INTEGRATION
# ===============================
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=INFO
